name: Native iPhone checks
on:
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test game rules
        working-directory: native
        run: swift test -j 2
      - name: Verify generated project
        working-directory: native
        run: |
          python3 tools/generate-project.py
          git diff --exit-code -- Lupo.xcodeproj
      - name: Build for iPhone simulator
        working-directory: native
        run: xcodebuild -project Lupo.xcodeproj -scheme Lupo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run iPhone interaction checks
        working-directory: native
        run: |
          simulator_id=$(python3 tools/select-simulator.py)
          xcodebuild -project Lupo.xcodeproj -scheme Lupo -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export readable UI evidence
        if: always()
        working-directory: native
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path UITestScreenshots
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact > UITestSummary.json
          fi
      - name: Save UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lupo-iphone-test-results
          path: |
            native/TestResults.xcresult
            native/UITestScreenshots
            native/UITestSummary.json
          if-no-files-found: ignore
          retention-days: 7
